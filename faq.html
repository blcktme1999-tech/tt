  <main class="content-page"><article class="content-card"><p class="eyebrow">FAQ</p><h1>常見問答</h1><section><h2>送出申請後是否代表案件已受理？</h2><p>不是。送出申請後需等待後台審核，審核通過後才可進入案件工作區進行視訊與訊息聯繫。</p></section><section><h2>為什麼要按加入會議？</h2><p>為避免未經確認就啟動視訊，民眾與服務人員都需要手動加入會議。攝影機與麥克風也可分別手動開關。</p></section><section><h2>無法聽到聲音怎麼辦？</h2><p>部分瀏覽器會阻擋自動播放聲音。若畫面提示播放聲音，請按下按鈕恢復遠端音訊。</p></section></article></main>
