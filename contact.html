  <main class="content-page"><article class="content-card"><p class="eyebrow">Contact</p><h1>聯絡資訊</h1><p>本頁提供線上服務使用提醒與緊急聯絡方式。實際承辦窗口、服務時間與地址可依正式部署單位補齊。</p><section><h2>緊急報案</h2><p>如遇緊急事故、人身安全危險或正在發生的犯罪，請立即撥打 <a href="tel:110">110</a>。</p></section><section><h2>線上服務</h2><p>一般線上視訊報案申請請由民眾服務入口送出；已開通案件可於案件工作區傳送訊息及附件。</p><p><a class="site-button primary" href="/service">前往民眾服務</a></p></section></article></main>
