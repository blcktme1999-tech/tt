  <main class="content-page"><article class="content-card"><p class="eyebrow">About</p><h1>關於服務</h1><p>本網站為自製警政線上報案服務入口，整合民眾申請、案件審核、視訊會議與案件訊息紀錄，讓服務流程集中在同一套系統中操作。</p><section><h2>服務定位</h2><p>本服務用於可進行線上審核及視訊聯繫的案件情境。緊急事故、人身安全危險或正在發生的犯罪，請立即撥打 110。</p></section><section><h2>功能範圍</h2><ul><li>民眾填寫基本資料並申請開通。</li><li>管理端審核案件、建立服務人員帳號。</li><li>雙方手動加入視訊會議並保留案件訊息紀錄。</li></ul></section><p><a class="site-button primary" href="/service">前往民眾服務</a></p></article></main>
